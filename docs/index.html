<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subvencions Nou Patufet</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--mut:#656d76;--line:#e3e1d9;--ok:#1a7f37;--mid:#9a6700;--bad:#b42318;--acc:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--card:#1f2228;--ink:#e6e8eb;--mut:#9aa3ad;--line:#30343b;--ok:#4ac26b;--mid:#d4a72c;--bad:#f97066;--acc:#fb923c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:0 0 2px}.sub{color:var(--mut);margin:0 0 18px;font-size:.92rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.bar input[type=search],.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.bar input[type=search]{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:8px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.chk{color:var(--mut);font-size:.9rem;display:flex;gap:6px;align-items:center}
details.grup{margin:0 0 14px}details.grup>summary{cursor:pointer;font-weight:650;padding:6px 2px;list-style:none;display:flex;gap:8px;align-items:baseline}
details.grup>summary::-webkit-details-marker{display:none}
details.grup>summary::before{content:"▸";color:var(--mut)}details.grup[open]>summary::before{content:"▾"}
.n{color:var(--mut);font-weight:400;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mid);border-radius:10px;padding:12px 14px;margin:8px 0}
.card.alt{border-left-color:var(--ok)}.card.baix{border-left-color:var(--line);opacity:.85}.card.caducada{opacity:.55}
.card h3{margin:0 0 4px;font-size:1.02rem}.card h3 a{color:inherit}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mut);font-size:.88rem;margin-bottom:6px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:600;border:1px solid var(--line)}
.pill.si{color:var(--ok)}.pill.dub{color:var(--mid)}.pill.no{color:var(--bad)}
.card p{margin:4px 0;font-size:.93rem}.card b{font-weight:600}
.dies{font-weight:600}.dies.urg{color:var(--bad)}
.go{border:0;background:var(--acc);color:#fff;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}.go:disabled{opacity:.5;cursor:default}
#est{color:var(--mut);font-size:.9rem;margin:-8px 0 14px;min-height:1.2em}
.acc{margin-top:8px;text-align:right}.del{border:1px solid var(--line);background:transparent;color:var(--mut);padding:3px 10px;border-radius:7px;font:inherit;font-size:.82rem;cursor:pointer}.del:hover{color:var(--bad);border-color:var(--bad)}.del:disabled{opacity:.5}
.buit{color:var(--mut);padding:30px 0;text-align:center}
.manual{margin-top:30px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-size:.9rem}
a{color:var(--acc)}
</style>
</head>
<body><div class="wrap">
<h1>Subvencions per a Nou Patufet</h1>
<p class="sub">Convocatòries detectades pel Patu-Bot, agrupades per organisme. Actualitzat el <span id="gen"></span>.</p>
<div class="bar">
  <div class="seg" role="group" aria-label="Mostra">
    <button id="m-op" aria-pressed="true">Oportunitats</button>
    <button id="m-tot" aria-pressed="false">Totes les avaluades</button>
  </div>
  <input type="search" id="q" placeholder="Cerca per títol, organisme, tema…">
  <select id="ord"><option value="encaix">Ordena: millor encaix</option><option value="termini">Ordena: termini més proper</option></select>
  <button class="go" id="llegeix" hidden>↻ Llegeix ara</button>
</div>
<div id="est" role="status"></div>
<div id="llista"></div>
<div class="manual" id="manual"></div>
</div>
<script>
const DADES = [{"id": "boe:BOE-A-2026-20973", "titol": "Orden SND/1063/2026, de 28 de septiembre: Acompañamiento a centros, servicios y equipos de atención temprana", "organisme": "Ministerio de Sanidad", "import_total": "Desconegut", "termini_text": "No consta en el fragment publicat", "termini_data": "", "elegibilitat": "No", "motiu_elegibilitat": "La convocatòria està adreçada exclusivament a entitats sense ànim de lucre del Tercer Sector d'Acció Social d'àmbit estatal, fet que exclou expressament una cooperativa de treball associat (SCCL) d'àmbit català.", "encaix": 1, "resum": "Convocatòria finançada amb fons FSE+ per a projectes d'acompanyament a centres i equips d'atenció primerenca (atenció precoç) per adaptar-los als nous estàndards del Consens Estatal de millora de l'atenció a la infància vulnerable.", "requisits": "1. Ser entitat sense ànim de lucre del Tercer Sector d'Acció Social. 2. Àmbit d'actuació estatal. 3. Projectes orientats a l'acompanyament i transformació de serveis d'atenció primerenca.", "accions": "Descartar la convocatòria per incompatibilitat absoluta de forma jurídica i àmbit d'actuació.", "adaptacio": "", "link": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-20973", "font": "BOE (Estat)", "estat": "descartada", "primera": "2026-10-08"}, {"id": "boe:BOE-A-2026-24492", "titol": "Resolución de 30 de octubre de 2026, del Instituto de Mayores y Servicios Sociales, por la que se aprueba la convocatoria para la elección de operaciones en el marco del Programa de Inclusión Social, Garantía Infantil y Lucha Contra la Pobreza (FSE+)", "organisme": "Ministerio de Derechos Sociales, Consumo y Agenda 2030 - Instituto de Mayores y Servicios Sociales (IMSERSO)", "import_total": "Desconegut", "termini_text": "Desconegut", "termini_data": "", "elegibilitat": "Sí", "motiu_elegibilitat": "La convocatòria està oberta expressament a 'entitats de l'economia social' (a més del tercer sector i ens locals); l'escola, com a cooperativa de treball associat (SCCL), té aquesta consideració jurídica.", "encaix": 4, "resum": "Convocatòria estatal per seleccionar projectes d'innovació o experimentació social cofinançats amb Fons Social Europeu Plus (FSE+) orientats a la inclusió social, la garantia infantil i la millora de l'accés a serveis socials per a col·lectius desfavorits.", "requisits": "1. Ser entitat del tercer sector d'acció social, entitat de l'economia social o ens local. 2. Presentar un projecte d'innovació o experimentació social alineat amb l'objectiu ESO4.11 (accés a serveis, infància i col·lectius vulnerables). 3. Subjecció a les regles de gestió i justificació de despeses del FSE+ (finançament per reemborsament de costos elegibles).", "accions": "Consultar el text íntegre de la resolució al BOE per verificar el termini de sol·licitud, el pressupost mínim exigit per operació i el percentatge de cofinançament necessari.", "adaptacio": "Plantejar una intervenció o pilot experimental des de l'àmbit socioeducatiu centrat en la inclusió, la garantia infantil i l'atenció a la infància vulnerable, preferiblement en aliança o consorci amb altres entitats del territori o de l'economia social.", "link": "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-24492", "font": "BOE (Estat)", "estat": "descartada", "primera": "2026-11-23"}, {"id": "boe:BOE-B-2026-37945", "titol": "Extracto de la Resolución de 16 de noviembre de 2026 de la Secretaría de Estado de Educación, por la que se convocan ayudas para participar en el programa nacional \"Centros de Educación Ambiental\" durante el año 2027", "organisme": "Ministerio de Educación, Formación Profesional y Deportes", "import_total": "247.315,50 €", "termini_text": "Fins al 3 de desembre de 2026 a les 12:00 h", "termini_data": "2026-12-03", "elegibilitat": "Sí", "motiu_elegibilitat": "La convocatòria s'adreça a centres docents espanyols sostinguts amb fons públics, condició que l'escola compleix com a centre concertat.", "encaix": 7, "resum": "Ajudes adreçades a centres educatius sostinguts amb fons públics per participar amb grups d'alumnat en estades formatives d'educació ambiental als centres de Viérnoles (Cantàbria) o Villardeciervos (Zamora) durant el 2027 (primavera o tardor).", "requisits": "1. Ser centre docent sostingut amb fons públics d'ensenyaments no universitaris. 2. Presentar la sol·licitud i projecte pedagògic per als períodes indicats (primavera o tardor de 2027). 3. Tramitació per la seu del Ministeri abans del termini límit.", "accions": "Consultar la convocatòria completa a la BDNS (ID 942473) per revisar quins cursos concrets d'alumnat hi poden participar i valorar amb l'equip docent si es presenta candidatura.", "adaptacio": "", "link": "https://www.boe.es/diario_boe/txt.php?id=BOE-B-2026-37945", "font": "BOE (Estat)", "estat": "oportunitat", "primera": "2026-11-18"}, {"id": "boe:BOE-B-2026-37946", "titol": "Extracto de la Resolución de 16 de noviembre de 2026 de la Secretaría de Estado de Educación, por la que se convocan ayudas para participar en el programa nacional 'Recuperación y utilización educativa de pueblos abandonados' durante el año 2027", "organisme": "Ministerio de Educación, Formación Profesional y Deportes", "import_total": "507.006,89 €", "termini_text": "Fins al 4 de desembre de 2026 a les 12.00 h (hora peninsular)", "termini_data": "2026-12-04", "elegibilitat": "Sí", "motiu_elegibilitat": "La convocatòria s'adreça a centres docents espanyols sostinguts amb fons públics, categoria en la qual l'escola s'inclou com a centre concertat.", "encaix": 8, "resum": "Ajudes per a la participació de grups escolars en estades educatives mediambientals i de convivència als nuclis rurals de Búbal (Aragó), Granadilla (Càceres) i Umbralejo (Guadalajara) durant la primavera i tardor de 2027.", "requisits": "Centres docents espanyols sostinguts amb fons públics; presentació del projecte de participació i documentació requerida; tramitació telemàtica abans del termini establert.", "accions": "Accedir a la fitxa completa de la convocatòria a la BDNS (ID 942475) per revisar els cursos convocats (habitualment 3r i 4t d'ESO) i coordinar amb l'equip pedagògic la redacció del projecte educatiu.", "adaptacio": "", "link": "https://www.boe.es/diario_boe/txt.php?id=BOE-B-2026-37946", "font": "BOE (Estat)", "estat": "oportunitat", "primera": "2026-11-18"}, {"id": "raisc:7495-26-198", "titol": "Convocatoria de subvencions per a projectes culturals que facin servir tecnologia immersiva", "organisme": "Oficina de Suport a la Iniciativa Cultural (OSIC)", "import_total": "2.000.000 €", "termini_text": "Fins al 15 de desembre de 2026", "termini_data": "2026-12-15", "elegibilitat": "Sí", "motiu_elegibilitat": "L'escola és una cooperativa de treball associat (SCCL) amb activitat econòmica i té la condició de pime, una categoria explícitament admesa entre els beneficiaris de la convocatòria.", "encaix": 4, "resum": "Subvencions destinades al desenvolupament i producció de projectes culturals que utilitzin tecnologies immersives (com realitat virtual, augmentada o entorns mixtos) impulsades per entitats o empreses.", "requisits": "Ser pime amb activitat econòmica o persona jurídica; presentar un projecte de caràcter estrictament cultural que integri tecnologies immersives; aportar memòria del projecte i pressupost desglossat segons les bases de l'OSIC.", "accions": "Consultar el text complet de les bases reguladores al DOGC per avaluar si l'escola compta amb prou capacitat tècnica o socis tecnològics per dissenyar una proposta cultural immersiva abans del 15 de desembre de 2026.", "adaptacio": "No és una línia educativa: caldria articular-ho com una producció o experiència cultural oberta al barri (per exemple, creació artística o patrimonial vinculada als projectes de teatre, cinema o memòria històrica de Gràcia) que empri realitat virtual o continguts immersius.", "link": "https://dogc.gencat.cat/ca/document-del-dogc/?documentId=1059651", "font": "RAISC (Generalitat/locals)", "estat": "descartada", "primera": "2026-11-23"}, {"id": "raisc:7705-26-002", "titol": "Convocatoria 24ns Premis eduCAC", "organisme": "CONSELL DE L'AUDIOVISUAL DE CATALUNYA", "import_total": "11.500 €", "termini_text": "Fins al 5 de gener de 2027", "termini_data": "2027-01-05", "elegibilitat": "Sí", "motiu_elegibilitat": "Els premis eduCAC van dirigits a centres educatius de Catalunya (inclosos concertats i cooperatives categoritzades com a PIME) i a la seva comunitat educativa.", "encaix": 7, "resum": "Premis escolars destinats a promoure l'educació mediàtica i reconèixer treballs i experiències audiovisuals realitzades per alumnat i professorat de centres educatius de Catalunya.", "requisits": "Centres educatius o professorat/alumnat de Catalunya; presentació de treballs audiovisuals o projectes d'educació en comunicació d'acord amb les categories de les bases; tramitació telemàtica abans del termini.", "accions": "Consultar les categories i bases detallades al web d'eduCAC i valorar la presentació de projectes audiovisuals del centre (com els de 'Fem cinema' o de l'estratègia digital).", "adaptacio": "", "link": "https://dogc.gencat.cat/ca/document-del-dogc/?documentId=1051990", "font": "RAISC (Generalitat/locals)", "estat": "oportunitat", "primera": "2026-10-05"}];
const MANUALS = [{"nom": "EduCaixa", "url": "https://educaixa.org/ca/convocatories"}, {"nom": "Fundació Carulla", "url": "https://fundaciocarulla.cat/"}];
const GENERAT = "2026-11-24";
let mode = "op";
const eliminades = new Set();
const $ = id => document.getElementById(id);
const avui = new Date(); avui.setHours(0,0,0,0);

function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})) { if (k==="class") e.className=v; else if (typeof v==="function") e[k]=v; else if (v!==null && v!==undefined) e.setAttribute(k,v); }
  for (const c of kids.flat()) if (c!==null && c!==undefined && c!=="") e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const segur = u => /^https?:\/\//i.test(u||"") ? u : null;
function dies(p){ if(!p.termini_data) return null; const d=new Date(p.termini_data+"T00:00:00"); return Math.round((d-avui)/86400000); }
function textDies(n){ if(n===null) return null; if(n<0) return "caducada fa "+(-n)+" d"; if(n===0) return "caduca avui"; return "queden "+n+" d"; }

function targeta(p){
  const n = dies(p), cad = n!==null && n<0;
  const cls = "card"+(p.encaix>=8?" alt":(p.encaix<6?" baix":""))+(cad?" caducada":"");
  const el = p.elegibilitat==="Sí"?"si":(p.elegibilitat==="No"?"no":"dub");
  const titol = segur(p.link) ? h("a",{href:p.link,target:"_blank",rel:"noopener"},p.titol) : p.titol;
  return h("div",{class:cls},
    h("h3",{},titol),
    h("div",{class:"meta"},
      h("span",{class:"pill "+el},"Elegibilitat: "+p.elegibilitat),
      h("span",{},"Encaix "+p.encaix+"/10"),
      h("span",{},"Import: "+(p.import_total||"Desconegut")),
      h("span",{}, "Termini: "+(p.termini_data||p.termini_text||"pendent"), n!==null? h("span",{class:"dies"+(n>=0&&n<=10?" urg":"")}," ("+textDies(n)+")") : "")),
    p.resum? h("p",{},p.resum):null,
    p.requisits? h("p",{},h("b",{},"Requisits: "),p.requisits):null,
    p.motiu_elegibilitat? h("p",{},h("b",{},"Elegibilitat: "),p.motiu_elegibilitat):null,
    p.accions? h("p",{},h("b",{},"Primer pas: "),p.accions):null,
    p.adaptacio? h("p",{},h("b",{},"Com adaptar-ho: "),p.adaptacio):null,
    h("div",{class:"acc"}, h("button",{class:"del",title:"Elimina aquesta proposta de la llista per a tothom",onclick:ev=>elimina(p,ev.currentTarget)},"Elimina")));
}

function pinta(){
  const q = $("q").value.trim().toLowerCase(), ord = $("ord").value;
  let llista = DADES.filter(p => !eliminades.has(p.id))
    .filter(p => (mode==="tot" || p.estat==="oportunitat"))
    .filter(p => !(dies(p)!==null && dies(p)<0))   // les caducades per data no es mostren (el bot també les esborra)
    .filter(p => !q || (p.titol+" "+p.organisme+" "+p.resum+" "+p.requisits).toLowerCase().includes(q));
  const cmp = ord==="termini" ? (a,b)=>(a.termini_data||"9999").localeCompare(b.termini_data||"9999") : (a,b)=>b.encaix-a.encaix;
  llista.sort(cmp);
  const grups = new Map();
  for (const p of llista){ const k=(p.organisme||"Sense organisme").trim(); if(!grups.has(k)) grups.set(k,[]); grups.get(k).push(p); }
  const ordenats = [...grups.entries()].sort((a,b)=> Math.max(...b[1].map(x=>x.encaix)) - Math.max(...a[1].map(x=>x.encaix)) || a[0].localeCompare(b[0],"ca"));
  const cont = $("llista"); cont.replaceChildren();
  if(!ordenats.length){ cont.append(h("div",{class:"buit"}, mode==="op" ? "Cap oportunitat activa ara mateix. El bot torna a mirar cada dia laborable." : "Encara no hi ha propostes avaluades.")); return; }
  for (const [org, ps] of ordenats){
    const d = h("details",{class:"grup",open:""}, h("summary",{}, org, h("span",{class:"n"}, ps.length+(ps.length===1?" proposta":" propostes"))));
    ps.forEach(p => d.append(targeta(p)));
    cont.append(d);
  }
}
function setMode(m){ mode=m; $("m-op").setAttribute("aria-pressed", m==="op"); $("m-tot").setAttribute("aria-pressed", m==="tot"); pinta(); }
$("m-op").onclick = ()=>setMode("op"); $("m-tot").onclick = ()=>setMode("tot");
["q","ord"].forEach(i => $(i).addEventListener("input", pinta));
$("gen").textContent = new Date(GENERAT+"T00:00:00").toLocaleDateString("ca-ES",{day:"numeric",month:"long",year:"numeric"});
$("manual").append("Fonts que el bot no pot llegir sol i cal mirar a mà: ", ...MANUALS.flatMap((m,i)=>[i?" · ":"", h("a",{href:m.url,target:"_blank",rel:"noopener"},m.nom)]));
pinta();

// ---- Eliminar propostes (llista compartida, es desa al servidor)
async function elimina(p, boto){
  if (!confirm("Eliminar aquesta proposta de la llista per a tothom?\n\n"+p.titol)) return;
  let pin = llegeix("pin");
  if (!pin) { pin = prompt("Codi d'accés:"); if (!pin) return; }
  boto.disabled = true;
  try {
    const r = await fetch("/api/eliminades", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pin, id:p.id})});
    if (r.ok) { guarda("pin", pin); eliminades.add(p.id); pinta(); return; }
    if (r.status===401) { guarda("pin", null); alert("Codi incorrecte."); }
    else { const j = await r.json().catch(()=>({})); alert("No s'ha pogut eliminar ("+r.status+")."+(j.detall?"\n"+j.detall:"")); }
  } catch(err) { alert("Error de xarxa."); }
  boto.disabled = false;
}
fetch("/api/eliminades").then(r=>r.ok?r.json():{ids:[]}).then(j=>{ (j.ids||[]).forEach(i=>eliminades.add(i)); pinta(); }).catch(()=>{});

// ---- Botó "Llegeix ara": crida /api/lectura (funció de Vercel) que dispara el workflow
const API = "/api/lectura";
const guarda = (k,v) => { try { v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} };
const llegeix = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
let sondeig = null, haVistCurs = false;
async function estatLectura(){ const r = await fetch(API); if(!r.ok) throw new Error(r.status); return r.json(); }
function missatge(t){ $("est").textContent = t; }
async function sondeja(){
  try {
    const e = await estatLectura();
    if (e.en_curs) { haVistCurs = true; $("llegeix").disabled = true; missatge("Lectura en curs… triga uns minuts."); return; }
    $("llegeix").disabled = false;
    if (haVistCurs) {
      clearInterval(sondeig); sondeig = null; haVistCurs = false;
      missatge(e.conclusio==="success" ? "Lectura acabada. Actualitzant el panell…" : "La lectura ha acabat amb errors (mira el correu o GitHub Actions).");
      if (e.conclusio==="success") setTimeout(()=>location.reload(), 90000);
    }
  } catch(err) { /* es torna a provar al proper sondeig */ }
}
function iniciaSondeig(){ if(!sondeig){ sondeja(); sondeig = setInterval(sondeja, 15000); } }
$("llegeix").onclick = async () => {
  let pin = llegeix("pin");
  if (!pin) { pin = prompt("Codi d'accés per llançar la lectura:"); if (!pin) return; }
  $("llegeix").disabled = true; missatge("Enviant la petició…");
  try {
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pin})});
    if (r.status===202) { guarda("pin", pin); haVistCurs = true; missatge("Lectura iniciada. Ho tindràs d'aquí a uns minuts."); iniciaSondeig(); return; }
    if (r.status===401) { guarda("pin", null); missatge("Codi incorrecte."); }
    else if (r.status===409) { missatge("Ja hi ha una lectura en curs."); iniciaSondeig(); return; }
    else missatge("No s'ha pogut iniciar la lectura ("+r.status+").");
  } catch(err) { missatge("Error de xarxa."); }
  $("llegeix").disabled = false;
};
estatLectura().then(e => { $("llegeix").hidden = false; if (e.en_curs) { haVistCurs = true; $("llegeix").disabled = true; iniciaSondeig(); } }).catch(()=>{});
</script>
</body></html>
