<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subvencions Nou Patufet</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--mut:#656d76;--line:#e3e1d9;--ok:#1a7f37;--mid:#9a6700;--bad:#b42318;--acc:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--card:#1f2228;--ink:#e6e8eb;--mut:#9aa3ad;--line:#30343b;--ok:#4ac26b;--mid:#d4a72c;--bad:#f97066;--acc:#fb923c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:0 0 2px}.sub{color:var(--mut);margin:0 0 18px;font-size:.92rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.bar input[type=search],.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.bar input[type=search]{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:8px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.chk{color:var(--mut);font-size:.9rem;display:flex;gap:6px;align-items:center}
details.grup{margin:0 0 14px}details.grup>summary{cursor:pointer;font-weight:650;padding:6px 2px;list-style:none;display:flex;gap:8px;align-items:baseline}
details.grup>summary::-webkit-details-marker{display:none}
details.grup>summary::before{content:"▸";color:var(--mut)}details.grup[open]>summary::before{content:"▾"}
.n{color:var(--mut);font-weight:400;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mid);border-radius:10px;padding:12px 14px;margin:8px 0}
.card.alt{border-left-color:var(--ok)}.card.baix{border-left-color:var(--line);opacity:.85}.card.caducada{opacity:.55}
.card h3{margin:0 0 4px;font-size:1.02rem}.card h3 a{color:inherit}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mut);font-size:.88rem;margin-bottom:6px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:600;border:1px solid var(--line)}
.pill.si{color:var(--ok)}.pill.dub{color:var(--mid)}.pill.no{color:var(--bad)}
.card p{margin:4px 0;font-size:.93rem}.card b{font-weight:600}
.dies{font-weight:600}.dies.urg{color:var(--bad)}
.go{border:0;background:var(--acc);color:#fff;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}.go:disabled{opacity:.5;cursor:default}
#est{color:var(--mut);font-size:.9rem;margin:-8px 0 14px;min-height:1.2em}
.acc{margin-top:8px;text-align:right}.del{border:1px solid var(--line);background:transparent;color:var(--mut);padding:3px 10px;border-radius:7px;font:inherit;font-size:.82rem;cursor:pointer}.del:hover{color:var(--bad);border-color:var(--bad)}.del:disabled{opacity:.5}
.buit{color:var(--mut);padding:30px 0;text-align:center}
.manual{margin-top:30px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-size:.9rem}
a{color:var(--acc)}
</style>
</head>
<body><div class="wrap">
<h1>Subvencions per a Nou Patufet</h1>
<p class="sub">Convocatòries detectades pel Patu-Bot, agrupades per organisme. Actualitzat el <span id="gen"></span>.</p>
<div class="bar">
  <div class="seg" role="group" aria-label="Mostra">
    <button id="m-op" aria-pressed="true">Oportunitats</button>
    <button id="m-tot" aria-pressed="false">Totes les avaluades</button>
  </div>
  <input type="search" id="q" placeholder="Cerca per títol, organisme, tema…">
  <select id="ord"><option value="encaix">Ordena: millor encaix</option><option value="termini">Ordena: termini més proper</option></select>
  <button class="go" id="llegeix" hidden>↻ Llegeix ara</button>
</div>
<div id="est" role="status"></div>
<div id="llista"></div>
<div class="manual" id="manual"></div>
</div>
<script>
const DADES = [{"id": "raisc:7705-26-002", "titol": "Convocatoria 24ns Premis eduCAC", "organisme": "CONSELL DE L'AUDIOVISUAL DE CATALUNYA", "import_total": "11.500 €", "termini_text": "Fins al 5 de gener de 2027", "termini_data": "2027-01-05", "elegibilitat": "Sí", "motiu_elegibilitat": "Els premis eduCAC van dirigits a centres educatius de Catalunya (inclosos concertats i cooperatives categoritzades com a PIME) i a la seva comunitat educativa.", "encaix": 7, "resum": "Premis escolars destinats a promoure l'educació mediàtica i reconèixer treballs i experiències audiovisuals realitzades per alumnat i professorat de centres educatius de Catalunya.", "requisits": "Centres educatius o professorat/alumnat de Catalunya; presentació de treballs audiovisuals o projectes d'educació en comunicació d'acord amb les categories de les bases; tramitació telemàtica abans del termini.", "accions": "Consultar les categories i bases detallades al web d'eduCAC i valorar la presentació de projectes audiovisuals del centre (com els de 'Fem cinema' o de l'estratègia digital).", "adaptacio": "", "link": "https://dogc.gencat.cat/ca/document-del-dogc/?documentId=1051990", "font": "RAISC (Generalitat/locals)", "estat": "oportunitat", "primera": "2026-10-05"}, {"id": "raisc:8390-26-007", "titol": "Convocatòria de subvencions de programes de formació A MIDA (Línia B) - Ordre EMT/146/2025", "organisme": "Consorci per a la Formació Contínua de Catalunya", "import_total": "1.800.000 €", "termini_text": "16/10/2026", "termini_data": "2026-10-16", "elegibilitat": "Dubtós", "motiu_elegibilitat": "L'escola és una cooperativa (pime) amb una plantilla habitualment inferior a 50 persones treballadores, complint el perfil de beneficiària, però a la Línia B cal comprovar si pot sol·licitar-ho directament o si ha de participar com a empresa adherida mitjançant una entitat de formació o federació (com EscolesCoop).", "encaix": 6, "resum": "Subvencions destinades al finançament de programes de formació a mida orientats a les necessitats formatives de les persones treballadores d'empreses de menys de 50 treballadors.", "requisits": "Empreses amb plantilla inferior a 50 persones treballadores; disseny d'un pla formatiu a mida; acompliment de la condició de pime amb activitat a Catalunya.", "accions": "Revisar l'Ordre EMT/146/2025 per determinar els requisits de l'entitat sol·licitant de la Línia B i consultar amb EscolesCoop si preparen una agrupació d'escoles adherides.", "adaptacio": "Pla de formació contínua per al claustre i personal d'administració i serveis en àmbits com innovació pedagògica, estratègia digital de centre, atenció a la diversitat o gestió cooperativa.", "link": "https://dogc.gencat.cat/ca/document-del-dogc/?documentId=1055563", "font": "RAISC (Generalitat/locals)", "estat": "oportunitat", "primera": "2026-10-05"}, {"id": "raisc:8390-26-006", "titol": "Subvencions de programes de formació A MIDA per a empreses (Línia A - Ordre EMT/146/2025)", "organisme": "Consorci per a la Formació Contínua de Catalunya", "import_total": "1.200.000 €", "termini_text": "16 d'octubre de 2026", "termini_data": "2026-10-16", "elegibilitat": "Sí", "motiu_elegibilitat": "L'escola és una cooperativa de treball associat (SCCL) amb activitat econòmica i plantilla laboral (docents i PAS), complint la condició de PYME beneficiària per a formar les seves persones treballadores.", "encaix": 7, "resum": "Subvencions destinades a finançar programes de formació dissenyats a mida per les empreses per capacitar i actualitzar les competències de les seves persones treballadores.", "requisits": "1. Ser PYME, gran empresa o persona física amb activitat econòmica a Catalunya amb persones treballadores en plantilla. 2. Presentar un programa formatiu a mida que respongui a les necessitats de l'organització. 3. Tramitació telemàtica segons els criteris i mòduls establerts a l'Ordre EMT/146/2025.", "accions": "Revisar amb urgència les bases tècniques de la convocatòria per definir el pla de formació de l'equip docent/PAS i tramitar la sol·licitud abans del 16 d'octubre.", "adaptacio": "Com a convocatòria adreçada al teixit empresarial, l'escola hi concorre com a cooperativa/PYME per finançar la formació contínua interna de l'equip (innovació pedagògica, eines digitals, coeducació, etc.).", "link": "https://dogc.gencat.cat/ca/document-del-dogc/?documentId=1055563", "font": "RAISC (Generalitat/locals)", "estat": "oportunitat", "primera": "2026-10-07"}];
const MANUALS = [{"nom": "EduCaixa", "url": "https://educaixa.org/ca/convocatories"}, {"nom": "Fundació Carulla", "url": "https://fundaciocarulla.cat/"}];
const GENERAT = "2026-10-07";
let mode = "op";
const eliminades = new Set();
const $ = id => document.getElementById(id);
const avui = new Date(); avui.setHours(0,0,0,0);

function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})) { if (k==="class") e.className=v; else if (typeof v==="function") e[k]=v; else if (v!==null && v!==undefined) e.setAttribute(k,v); }
  for (const c of kids.flat()) if (c!==null && c!==undefined && c!=="") e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const segur = u => /^https?:\/\//i.test(u||"") ? u : null;
function dies(p){ if(!p.termini_data) return null; const d=new Date(p.termini_data+"T00:00:00"); return Math.round((d-avui)/86400000); }
function textDies(n){ if(n===null) return null; if(n<0) return "caducada fa "+(-n)+" d"; if(n===0) return "caduca avui"; return "queden "+n+" d"; }

function targeta(p){
  const n = dies(p), cad = n!==null && n<0;
  const cls = "card"+(p.encaix>=8?" alt":(p.encaix<6?" baix":""))+(cad?" caducada":"");
  const el = p.elegibilitat==="Sí"?"si":(p.elegibilitat==="No"?"no":"dub");
  const titol = segur(p.link) ? h("a",{href:p.link,target:"_blank",rel:"noopener"},p.titol) : p.titol;
  return h("div",{class:cls},
    h("h3",{},titol),
    h("div",{class:"meta"},
      h("span",{class:"pill "+el},"Elegibilitat: "+p.elegibilitat),
      h("span",{},"Encaix "+p.encaix+"/10"),
      h("span",{},"Import: "+(p.import_total||"Desconegut")),
      h("span",{}, "Termini: "+(p.termini_data||p.termini_text||"pendent"), n!==null? h("span",{class:"dies"+(n>=0&&n<=10?" urg":"")}," ("+textDies(n)+")") : "")),
    p.resum? h("p",{},p.resum):null,
    p.requisits? h("p",{},h("b",{},"Requisits: "),p.requisits):null,
    p.motiu_elegibilitat? h("p",{},h("b",{},"Elegibilitat: "),p.motiu_elegibilitat):null,
    p.accions? h("p",{},h("b",{},"Primer pas: "),p.accions):null,
    p.adaptacio? h("p",{},h("b",{},"Com adaptar-ho: "),p.adaptacio):null,
    h("div",{class:"acc"}, h("button",{class:"del",title:"Elimina aquesta proposta de la llista per a tothom",onclick:ev=>elimina(p,ev.currentTarget)},"Elimina")));
}

function pinta(){
  const q = $("q").value.trim().toLowerCase(), ord = $("ord").value;
  let llista = DADES.filter(p => !eliminades.has(p.id))
    .filter(p => (mode==="tot" || p.estat==="oportunitat"))
    .filter(p => !(dies(p)!==null && dies(p)<0))   // les caducades per data no es mostren (el bot també les esborra)
    .filter(p => !q || (p.titol+" "+p.organisme+" "+p.resum+" "+p.requisits).toLowerCase().includes(q));
  const cmp = ord==="termini" ? (a,b)=>(a.termini_data||"9999").localeCompare(b.termini_data||"9999") : (a,b)=>b.encaix-a.encaix;
  llista.sort(cmp);
  const grups = new Map();
  for (const p of llista){ const k=(p.organisme||"Sense organisme").trim(); if(!grups.has(k)) grups.set(k,[]); grups.get(k).push(p); }
  const ordenats = [...grups.entries()].sort((a,b)=> Math.max(...b[1].map(x=>x.encaix)) - Math.max(...a[1].map(x=>x.encaix)) || a[0].localeCompare(b[0],"ca"));
  const cont = $("llista"); cont.replaceChildren();
  if(!ordenats.length){ cont.append(h("div",{class:"buit"}, mode==="op" ? "Cap oportunitat activa ara mateix. El bot torna a mirar cada dia laborable." : "Encara no hi ha propostes avaluades.")); return; }
  for (const [org, ps] of ordenats){
    const d = h("details",{class:"grup",open:""}, h("summary",{}, org, h("span",{class:"n"}, ps.length+(ps.length===1?" proposta":" propostes"))));
    ps.forEach(p => d.append(targeta(p)));
    cont.append(d);
  }
}
function setMode(m){ mode=m; $("m-op").setAttribute("aria-pressed", m==="op"); $("m-tot").setAttribute("aria-pressed", m==="tot"); pinta(); }
$("m-op").onclick = ()=>setMode("op"); $("m-tot").onclick = ()=>setMode("tot");
["q","ord"].forEach(i => $(i).addEventListener("input", pinta));
$("gen").textContent = new Date(GENERAT+"T00:00:00").toLocaleDateString("ca-ES",{day:"numeric",month:"long",year:"numeric"});
$("manual").append("Fonts que el bot no pot llegir sol i cal mirar a mà: ", ...MANUALS.flatMap((m,i)=>[i?" · ":"", h("a",{href:m.url,target:"_blank",rel:"noopener"},m.nom)]));
pinta();

// ---- Eliminar propostes (llista compartida, es desa al servidor)
async function elimina(p, boto){
  if (!confirm("Eliminar aquesta proposta de la llista per a tothom?\n\n"+p.titol)) return;
  let pin = llegeix("pin");
  if (!pin) { pin = prompt("Codi d'accés:"); if (!pin) return; }
  boto.disabled = true;
  try {
    const r = await fetch("/api/eliminades", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pin, id:p.id})});
    if (r.ok) { guarda("pin", pin); eliminades.add(p.id); pinta(); return; }
    if (r.status===401) { guarda("pin", null); alert("Codi incorrecte."); }
    else { const j = await r.json().catch(()=>({})); alert("No s'ha pogut eliminar ("+r.status+")."+(j.detall?"\n"+j.detall:"")); }
  } catch(err) { alert("Error de xarxa."); }
  boto.disabled = false;
}
fetch("/api/eliminades").then(r=>r.ok?r.json():{ids:[]}).then(j=>{ (j.ids||[]).forEach(i=>eliminades.add(i)); pinta(); }).catch(()=>{});

// ---- Botó "Llegeix ara": crida /api/lectura (funció de Vercel) que dispara el workflow
const API = "/api/lectura";
const guarda = (k,v) => { try { v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} };
const llegeix = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
let sondeig = null, haVistCurs = false;
async function estatLectura(){ const r = await fetch(API); if(!r.ok) throw new Error(r.status); return r.json(); }
function missatge(t){ $("est").textContent = t; }
async function sondeja(){
  try {
    const e = await estatLectura();
    if (e.en_curs) { haVistCurs = true; $("llegeix").disabled = true; missatge("Lectura en curs… triga uns minuts."); return; }
    $("llegeix").disabled = false;
    if (haVistCurs) {
      clearInterval(sondeig); sondeig = null; haVistCurs = false;
      missatge(e.conclusio==="success" ? "Lectura acabada. Actualitzant el panell…" : "La lectura ha acabat amb errors (mira el correu o GitHub Actions).");
      if (e.conclusio==="success") setTimeout(()=>location.reload(), 90000);
    }
  } catch(err) { /* es torna a provar al proper sondeig */ }
}
function iniciaSondeig(){ if(!sondeig){ sondeja(); sondeig = setInterval(sondeja, 15000); } }
$("llegeix").onclick = async () => {
  let pin = llegeix("pin");
  if (!pin) { pin = prompt("Codi d'accés per llançar la lectura:"); if (!pin) return; }
  $("llegeix").disabled = true; missatge("Enviant la petició…");
  try {
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pin})});
    if (r.status===202) { guarda("pin", pin); haVistCurs = true; missatge("Lectura iniciada. Ho tindràs d'aquí a uns minuts."); iniciaSondeig(); return; }
    if (r.status===401) { guarda("pin", null); missatge("Codi incorrecte."); }
    else if (r.status===409) { missatge("Ja hi ha una lectura en curs."); iniciaSondeig(); return; }
    else missatge("No s'ha pogut iniciar la lectura ("+r.status+").");
  } catch(err) { missatge("Error de xarxa."); }
  $("llegeix").disabled = false;
};
estatLectura().then(e => { $("llegeix").hidden = false; if (e.en_curs) { haVistCurs = true; $("llegeix").disabled = true; iniciaSondeig(); } }).catch(()=>{});
</script>
</body></html>
