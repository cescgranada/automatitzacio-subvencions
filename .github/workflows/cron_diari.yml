name: Execucio Diaria Patu-Bot Nou Patufet

on:
  schedule:
    - cron: '30 5 * * 1-5'   # dilluns a divendres, 05:30 UTC (07:30 estiu / 06:30 hivern)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'

permissions:
  contents: write

concurrency:
  group: patubot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar codi del repositori
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instal·lar llibreries
        run: pip install -r requirements-dev.txt

      - name: Tests (si fallen, no s'envia res)
        run: python -m pytest -q tests

      - name: Executar el Patu-Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: python monitor_subvencions.py

      # S'executa sempre: guarda l'estat encara que el bot hagi fallat. El fitxer
      # ultima_execucio.json canvia cada dia, i així GitHub no desactiva el cron per inactivitat (60 dies).
      - name: Guardar estat (historial, oportunitats, última execució)
        if: always()
        run: |
          git config user.name "Patu-bot"
          git config user.email "bot@noupatufet.cat"
          for f in historial_subvencions.json oportunitats.json propostes.json ultima_execucio.json docs/index.html; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Sense canvis d'estat."
          else
            git commit -m "Estat del Patu-Bot $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi
