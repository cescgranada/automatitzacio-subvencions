name: Execucio Diaria Subvencions Nou Patufet

on:
  schedule:
    # S'executa cada dia a les 05:30 AM UTC (06:30 AM o 07:30 AM a Gràcia segons l'horari d'estiu/hivern)
    - cron: '30 5 * * *'
  workflow_dispatch: # Permet l'execució manual des de la pestanya Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codi del repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instal·lar llibreries necessaries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar el script de subvencions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }} # Afegit per a la connexió amb Drive
        run: python monitor_subvencions.py
